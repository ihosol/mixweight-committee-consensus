syntax = "proto3";
package chain.adaptivecommittee;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "chain/adaptivecommittee/params.proto";

option go_package = "chain-five-three/x/adaptivecommittee/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/chain/adaptivecommittee/params";
  }

  // LastDraw returns the most recently drawn committee for a given tag.
  rpc LastDraw(QueryLastDrawRequest) returns (QueryLastDrawResponse) {
    option (google.api.http).get = "/chain/adaptivecommittee/last_draw/{tag}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false];
}

// QueryLastDrawRequest is request type for the Query/LastDraw RPC method.
message QueryLastDrawRequest {
  string tag = 1;
}

// QueryLastDrawResponse is response type for the Query/LastDraw RPC method.
message QueryLastDrawResponse {
  // members_csv is a comma-separated list of validator operator addresses.
  string members_csv = 1;
}
